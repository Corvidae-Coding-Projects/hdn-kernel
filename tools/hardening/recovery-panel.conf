#
# Product recovery panel actions consumed by hdn-recovery-panel.
# Keep this file root-owned and not writable by group/other.
#
# Format:
#   describe-helper PATH
#   portal-helper PATH
#   action RECOVERY_ACTION DESCRIBE_ACTION PORTAL_ACTION
#
# Recovery shells and graphical recovery panels should call hdn-recovery-panel
# with stable product verbs from this file instead of knowing metadata, portal,
# session, recovery action, broker, or securityfs helper names.

describe-helper /usr/libexec/hdn-recovery-describe
portal-helper /usr/libexec/hdn-recovery-portal
action rollback-policy policy-rollback rollback-policy
action repair-system package-repair repair-system
