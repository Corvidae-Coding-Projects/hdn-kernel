#
# Product recovery UI actions consumed by hdn-recovery-ui.
# Keep this file root-owned and not writable by group/other.
#
# Format:
#   panel-helper PATH
#   title TEXT
#   message TEXT
#   action RECOVERY_ACTION
#
# The graphical recovery frontend uses hdn-recovery-panel for metadata and
# action routing. Recovery UI should list only stable product verbs from this
# file instead of knowing metadata, portal, session, broker, or securityfs
# helper names.

panel-helper /usr/libexec/hdn-recovery-panel
title System Recovery
message Choose a repair or rollback action.
action repair-system
action rollback-policy
