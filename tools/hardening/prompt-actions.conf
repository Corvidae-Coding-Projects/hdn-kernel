#
# Named post-auth product actions consumed by hdn-prompt-dispatch.
# Keep this file root-owned and not writable by group/other.
#
# Format:
#   action NAME INTENT [ARG...]
#
# A desktop authentication daemon should authenticate the user, then call
# hdn-prompt-dispatch with one of these product action names. The dispatcher
# creates a short-lived approval token and invokes hdn-admin-broker with the
# broker intent and arguments from this root-owned config.

action package-update rofs-transaction /usr -- /usr/libexec/hdn-package-worker
action image-update rofs-transaction /usr -- /usr/libexec/hdn-image-worker
action policy-rollback policy-rollback
