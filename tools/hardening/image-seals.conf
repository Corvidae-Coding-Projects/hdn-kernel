#
# Named product image sealing sequences consumed by hdn-image-seal.
# Keep this file root-owned and not writable by group/other.
#
# Format:
#   seal NAME policy-commit SIGNED_POLICY
#   seal NAME rofs-apply READONLY_LIST
#
# Repeated lines with the same NAME run in file order. Runtime boot and
# package hooks use default after the dedicated policy loader has sealed the
# signed policy. Provisioning flows that own initial policy load use provision.

seal default rofs-apply /etc/hdn/readonly-mounts.conf
seal provision policy-commit /usr/lib/hdn/policies/default.hdn
seal provision rofs-apply /etc/hdn/readonly-mounts.conf
