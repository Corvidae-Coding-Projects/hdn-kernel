#
# Product recovery UI actions consumed by hdn-recovery-portal.
# Keep this file root-owned and not writable by group/other.
#
# Format:
#   session-helper PATH
#   action RECOVERY_UI_ACTION RECOVERY_SESSION_ACTION
#
# Recovery shells and graphical recovery panels should call hdn-recovery-portal
# with a branded action name from this file instead of invoking recovery
# session, recovery action, broker, or securityfs helpers directly.

session-helper /usr/libexec/hdn-recovery-session
action rollback-policy policy-rollback
action repair-system package-repair
