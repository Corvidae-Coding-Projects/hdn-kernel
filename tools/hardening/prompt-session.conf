#
# Prompt session backend consumed by hdn-prompt-session.
# Keep this file root-owned and not writable by group/other.
#
# The session helper reads product prompt metadata, passes it to the
# authenticator over stdin, and dispatches the named action only after the
# authenticator exits successfully.

describe-helper /usr/libexec/hdn-prompt-describe
auth-helper /usr/libexec/hdn-auth-prompt
dispatch-helper /usr/libexec/hdn-prompt-dispatch
