#
# Product settings UI actions consumed by hdn-settings-ui.
# Keep this file root-owned and not writable by group/other.
#
# Format:
#   settings-panel-helper PATH
#   title TEXT
#   message TEXT
#   action SETTINGS_ACTION LABEL
#
# Graphical settings surfaces should call hdn-settings-ui when they want a
# complete dependency-light action selector, or hdn-settings-panel directly
# when the product frontend owns its own layout.

settings-panel-helper /usr/libexec/hdn-settings-panel
title System Settings
message Choose an approved system action.
action updates.install Install system updates
