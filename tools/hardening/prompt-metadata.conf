# SPDX-License-Identifier: GPL-2.0-only
#
# Human-facing metadata for product prompt actions consumed by
# hdn-prompt-describe. Keep this file root-owned and not writable by
# group/other.
#
# Format:
#   prompt NAME FIELD VALUE
#
# Fields:
#   title        Short prompt title.
#   message      Human-readable operation summary.
#   consequence  What will change if the user approves.
#   risk         Optional risk label for UI styling or policy.

prompt package-update title Install system updates
prompt package-update message The operating system will update protected system files.
prompt package-update consequence The system image is temporarily writable and then resealed.
prompt package-update risk system

prompt image-update title Apply image update
prompt image-update message The base operating system image will be replaced with a trusted update.
prompt image-update consequence The protected system image is resealed after the update completes.
prompt image-update risk system

prompt policy-rollback title Roll back security policy
prompt policy-rollback message The previous signed hardening policy will become active.
prompt policy-rollback consequence Current policy changes are reverted through the recovery path.
prompt policy-rollback risk recovery
