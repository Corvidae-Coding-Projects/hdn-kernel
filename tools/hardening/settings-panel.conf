#
# Product settings-panel actions consumed by hdn-settings-panel.
# Keep this file root-owned and not writable by group/other.
#
# Format:
#   control-center-helper PATH
#   action SETTINGS_ACTION CONTROL_CENTER_ACTION
#
# Graphical settings panels should call hdn-settings-panel with stable product
# verbs from this file instead of knowing control center, desktop daemon,
# prompt, token, broker, or lower-level helper command lines.

control-center-helper /usr/libexec/hdn-control-center
action updates.install updates.install
