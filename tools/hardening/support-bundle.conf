# Product support-bundle policy consumed by hdn-support-bundle.
# Keep this file root-owned and not writable by group or other.
#
# Grammar:
#   status-helper PATH
#   event-decode-helper PATH
#   event-input PATH
#   include-compat 0|1
#   include-events 0|1
#   max-section-bytes BYTES
#
# The default shipped config collects stable product status and compatibility
# family state only. Products may enable event inclusion when their support
# policy allows decoded hardening event export.

status-helper /usr/libexec/hdn-status
event-decode-helper /usr/libexec/hdn-event-decode
event-input /sys/kernel/security/hardening/events
include-compat 1
include-events 0
max-section-bytes 65536
