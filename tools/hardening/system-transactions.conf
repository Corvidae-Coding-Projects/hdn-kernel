#
# Named product update transactions consumed by hdn-system-transaction.
# Keep this file root-owned and not writable by group/other.
#
# Format:
#   transaction NAME MOUNTPOINT WORKER [ARG...]
#
transaction package-update /usr /usr/libexec/hdn-package-worker
transaction package-repair /usr /usr/libexec/hdn-package-worker repair
#
# Additional product-specific operations can be added by the distro image:
# transaction image-update /usr /usr/libexec/hdn-image-updater
