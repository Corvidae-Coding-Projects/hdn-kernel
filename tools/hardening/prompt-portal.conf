#
# Product desktop prompt actions consumed by hdn-prompt-portal.
# Keep this file root-owned and not writable by group/other.
#
# Format:
#   session-helper PATH
#   action DESKTOP_ACTION PROMPT_SESSION_ACTION
#
# Desktop shells, settings panels, and update notifiers should call
# hdn-prompt-portal with a branded action name from this file instead of
# invoking prompt-session, prompt-dispatch, token, or broker helpers directly.

session-helper /usr/libexec/hdn-prompt-session
elevation-helper /usr/bin/pkexec
action package-update package-update
action image-update image-update
action policy-rollback policy-rollback
