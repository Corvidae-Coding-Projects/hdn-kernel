#
# Named policy review workflows consumed by hdn-policy-workflow.
# Keep this file root-owned and not writable by group/other.
#
# Format:
#   admin-broker PATH
#   workflow NAME BASE_POLICY EVENT_LOG SUGGESTIONS CANDIDATE_POLICY [BINARY_POLICY [SIGNED_POLICY]]
#
# Product images should point these at their own root-owned policy store and
# event spool locations.
#
# workflow default /etc/hdn/policies/base.policy /var/lib/hdn/events.log /var/lib/hdn/policy-review/default.frag /var/lib/hdn/policy-review/candidate.policy /var/lib/hdn/policy-review/candidate.unsigned.hdn /usr/lib/hdn/policies/candidate.hdn
